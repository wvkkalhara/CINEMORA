name = "cinemora"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Never expose a *.workers.dev copy (or per-version preview URLs) that Google could index.
workers_dev = false
preview_urls = false

# Cloudflare creates the DNS records and SSL certificates for these automatically.
# The Worker 301-redirects www -> apex, so both must point at it.
routes = [
  { pattern = "cinemoraproduction.com", zone_name = "cinemoraproduction.com", custom_domain = true },
  { pattern = "www.cinemoraproduction.com", zone_name = "cinemoraproduction.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker for every request so redirects, per-page SEO and security headers always apply.
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
CANONICAL_HOST = "cinemoraproduction.com"
# Update this date whenever you change the site content (used for <lastmod> in sitemap.xml).
SITE_LASTMOD = "2026-11-14"

[observability]
enabled = true
