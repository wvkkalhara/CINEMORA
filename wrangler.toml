name = "cinemora"
main = "src/index.js"
compatibility_date = "2026-11-01"

# TEMPORARY: no custom domain yet, so the site runs on https://cinemora.<your-subdomain>.workers.dev
# The Worker marks that address "noindex" so Google won't index it.
# When cinemoraproduction.com is bought and Active in this Cloudflare account:
#   1. set workers_dev = false
#   2. uncomment the routes block below
#   3. push to GitHub (Cloudflare redeploys and attaches the domain + SSL automatically)
workers_dev = true
preview_urls = false

# routes = [
#   { pattern = "cinemoraproduction.com", zone_name = "cinemoraproduction.com", custom_domain = true },
#   { pattern = "www.cinemoraproduction.com", zone_name = "cinemoraproduction.com", custom_domain = true },
# ]

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker for every request so redirects, per-page SEO and security headers always apply.
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
CANONICAL_HOST = "cinemoraproduction.com"
# Update this date whenever you change the site content (used for <lastmod> in sitemap.xml).
SITE_LASTMOD = "2026-11-16"

[observability]
enabled = true
